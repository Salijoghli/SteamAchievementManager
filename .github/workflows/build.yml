name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build SAM.sln -c Release -v:minimal -nologo

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SteamAchievementManager
          path: |
            LICENSE.txt
            upload/*.exe
            upload/*.dll
