name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build SAM.sln -c Release -p:Platform=x64 -v:minimal -nologo

      - name: Test
        if: hashFiles('SAM.App.Tests/SAM.App.Tests.csproj') != ''
        run: dotnet test SAM.App.Tests -c Release -p:Platform=x64 --no-build -v:minimal -nologo

      - name: Package single-file SAM.exe
        shell: pwsh
        run: ./build.ps1

      - name: Upload SAM.exe
        uses: actions/upload-artifact@v4
        with:
          name: SteamAchievementManager
          path: |
            upload/SAM.exe
            LICENSE.txt
