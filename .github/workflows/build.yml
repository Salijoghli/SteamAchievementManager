name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild SAM.sln -restore -p:Configuration=Release -v:minimal -nologo

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SteamAchievementManager
          path: |
            LICENSE.txt
            upload/*.exe
            upload/*.dll
