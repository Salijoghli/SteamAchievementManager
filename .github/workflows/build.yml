name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build classic apps (x86)
        run: dotnet build SAM.sln -c Release -p:Platform=x86 -v:minimal -nologo

      - name: Build new app (x64)
        run: dotnet build SAM.sln -c Release -p:Platform=x64 -v:minimal -nologo

      - name: Upload classic apps
        uses: actions/upload-artifact@v4
        with:
          name: SteamAchievementManager-classic
          path: |
            LICENSE.txt
            upload/*.exe
            upload/*.dll

      - name: Upload new app
        uses: actions/upload-artifact@v4
        with:
          name: SteamAchievementManager
          path: |
            LICENSE.txt
            upload/app/
            !upload/app/**/*.pdb
